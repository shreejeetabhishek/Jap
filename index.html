<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#170d08">
  <meta name="description" content="Divya Jap — a quiet, offline-friendly digital mala for naam jap and mantra jap.">
  <title>Divya Jap — Digital Mala</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="app">
    <header class="topbar">
      <button class="pill" id="chantOpen" type="button"><span class="om">ॐ</span><span>Chant</span><span class="chevron">⌄</span></button>
      <div class="stats" aria-live="polite">
        <div><small>MALAS</small><strong id="malas">0</strong></div>
        <i></i>
        <div><small>TOTAL</small><strong id="total">0</strong></div>
      </div>
      <div class="actions">
        <button class="icon-btn" id="soundToggle" type="button" aria-label="Toggle sound" title="Sound">♫</button>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle theme" title="Theme">☼</button>
        <button class="icon-btn" id="reset" type="button" aria-label="Reset current mala" title="Reset">↻</button>
      </div>
    </header>

    <section class="chant">
      <div class="eyebrow" id="chantType">NAAM JAP</div>
      <h1 id="chantTitle">RAM</h1>
      <p id="chantSubtitle">श्री राम जय राम जय जय राम</p>
    </section>

    <section class="mala-wrap" id="malaStage" aria-label="Interactive hanging mala. Tap or swipe upward to count a bead.">
      <canvas id="malaCanvas"></canvas>
      <div class="gesture-hint" id="gestureHint"><span>↑</span><small>SWIPE UP OR TAP</small></div>
      <div class="toast" id="toast" role="status"></div>
    </section>

    <footer class="dock">
      <button class="target" id="targetOpen" type="button">
        <strong id="countDisplay">0</strong><span>/</span><b id="targetDisplay">108</b><small>BEADS</small><span class="chevron">⌃</span>
      </button>
      <div class="progress"><span id="progressFill"></span></div>
      <nav class="materials" aria-label="Mala material">
        <button class="material active" data-material="rudraksha" type="button"><i class="dot rudra"></i>RUDRAKSHA</button>
        <button class="material" data-material="tulsi" type="button"><i class="dot tulsi"></i>TULSI</button>
        <button class="material" data-material="sphatik" type="button"><i class="dot sphatik"></i>SPHATIK</button>
        <button class="material" data-material="chandan" type="button"><i class="dot chandan"></i>CHANDAN</button>
      </nav>
      <p class="footer-note">A moment of stillness. One bead at a time.</p>
    </footer>
  </main>

  <dialog id="chantDialog" class="sheet">
    <form method="dialog" class="sheet-inner">
      <header><h2>Select your chant</h2><button class="close" aria-label="Close">×</button></header>
      <div class="tabs">
        <button type="button" class="tab active" data-tab="naam">Naam Jap</button>
        <button type="button" class="tab" data-tab="mantra">Mantras</button>
        <button type="button" class="tab" data-tab="custom">Custom</button>
      </div>
      <div class="chant-list" id="chantList"></div>
      <div id="customPanel" class="custom-panel hidden">
        <label>Chant name<input id="customName" maxlength="42" placeholder="e.g. OM NAMAH SHIVAYA"></label>
        <label>Subtitle<input id="customSubtitle" maxlength="100" placeholder="Optional Devanagari text"></label>
        <button class="primary" id="applyCustom" type="button">Use this chant</button>
      </div>
    </form>
  </dialog>

  <dialog id="targetDialog" class="sheet">
    <form method="dialog" class="sheet-inner">
      <header><h2>Mala bead count</h2><button class="close" aria-label="Close">×</button></header>
      <p class="sheet-note">Choose a traditional count or enter your own target.</p>
      <div class="presets" id="presets"></div>
      <label class="custom-count">Custom count<input id="customCount" type="number" min="1" max="1008" placeholder="1–1008"></label>
      <button class="primary" id="applyCount" type="button">Set target</button>
    </form>
  </dialog>

  <script type="application/json" id="app-config">{"version":"1.0.0","offline":"no external requests"}</script>
</body>
</html>
